{% extends "base.html" %}
{% load static %}

{% block content %}
<h1 class="mb-3 text-center">Posts</h1>

<a href="{% url 'novo_post' %}" class="btn btn-success mb-3">Novo Post</a>

{% for post in posts %}
  <div class="card-custom d-flex align-items-start">
    {% if post.autor.imagem %}
      <img src="{{ post.autor.imagem.url }}" class="profile-pic" alt="">
    {% endif %}
    <div>
      <a href="{% url 'detalhes_post' post.pk %}" class="text-dark text-decoration-none">
        <span class="post-author d-block fw-bold">{{ post.autor.codinome }}</span>
        <span class="post-message">{{ post.mensagem|linebreaksbr }}</span>
      </a>
      <div class="mt-2">
        <a href="{% url 'editar_post' post.pk %}" class="btn btn-sm btn-outline-primary">Editar</a>
        <a href="{% url 'excluir_post' post.pk %}" class="btn btn-sm btn-outline-danger">Excluir</a>
      </div>
    </div>
  </div>
{% empty %}
  <p class="text-muted text-center">Nenhum post encontrado.</p>
{% endfor %}
{% endblock content %}

{% extends 'base_villain.html' %}
{% block content %}
  <div class="container mt-4">
    <h2>Confirmar Exclusão</h2>
    <p>Tem certeza que deseja excluir o vilão <strong>{{ object.codinome }}</strong>?</p>

    <form method="post">
      {% csrf_token %}
      <a href="{% url 'lista_viloes' %}" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-danger">Excluir</button>
    </form>
  </div>
{% endblock %}

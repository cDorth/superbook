{% extends 'base.html' %}
{% block content %}
  <div class="container mt-4">
    <div class="form-card">
      <h2>Novo Post</h2>
      <form method="POST">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
              <div class="text-danger">
                {% for error in field.errors %}
                  <small>{{ error }}</small>
                {% endfor %}
              </div>
            {% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Salvar</button>
      </form>
    </div>
  </div>
{% endblock %}
